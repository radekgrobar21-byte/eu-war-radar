name: EU War Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser

      - name: Run radar
        run: python radar.py